name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run MJCF audit tool against fixture
        run: python tools/audit_mjcf.py tests/fixtures/minimal_mjcf.xml --mapping tests/fixtures/minimal_joint_map.json
